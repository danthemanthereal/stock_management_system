{% extends "base.html" %}

{% block content %}
<style>
    .menu-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 40px;
    }
    .card {
        background: #ecf0f1;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        width: 30%;
        text-decoration: none; /* Wichtig für Links */
        color: #2c3e50;
        transition: transform 0.2s;
    }
    .card:hover {
        transform: translateY(-5px);
        background: #dfe6e9;
    }
</style>

<h1 style="text-align: center;">Willkommen im Dashboard</h1>
<p style="text-align: center;">Bitte wähle einen Bereich aus:</p>

<div class="menu-grid">
    <!-- Links zu deinen neuen Seiten -->
    <a href="/watchlist" class="card">
        <h3>👀 Watchlist</h3>
        <p>Alle beobachteten Aktien anzeigen</p>
    </a>

    <a href="/portfolio" class="card">
        <h3>💼 Portfolio</h3>
        <p>Gekaufte Aktien verwalten</p>
    </a>

    <a href="/analysis" class="card">
        <h3>🧠 Analyse & News</h3>
        <p>Finanzkennzahlen auswerten & KI-News</p>
    </a>
</div>
{% endblock %}
