<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kennzahl bearbeiten - {{ profile.name }}</title>
</head>
<body>
<h1>Kennzahl bearbeiten für Branche: <strong>{{ profile.name }}</strong></h1>

<!-- Die URL enthält nun die Profile ID und die Metric ID -->
<form action="/metrics/update/{{ profile.id }}/{{ metric.id }}" method="post">

    <h3>Stammdaten (Global)</h3>
    <label>
        Name:
        <input type="text" name="name" value="{{ metric.name }}" required>
    </label>
    <br><br>

    <label>
        Einheit:
        <input type="text" name="unit" value="{{ metric.unit }}" required>
    </label>
    <br><br>

    <label>
        Kategorie:
        <select name="category_id">
            <option value="">— keine —</option>
            {% for c in metric_categories %}
            <option value="{{ c.id }}" {% if metric.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </label>

    <hr>
    <h3>Branchenspezifische Werte (Nur {{ profile.name }})</h3>

    <label>
        Sollte steigen:
        <!-- Zugriff über 'config' Objekt -->
        <input type="checkbox" name="should_rise" {% if config.should_rise %}checked{% endif %}>
    </label>
    <br><br>

    <label>
        Richtwert:
        <!-- Zugriff über 'config' Objekt -->
        <input type="number" name="reference_value" value="{{ config.reference_value }}">
    </label>
    <br><br>

    <label>
        Ist Aktiv in dieser Branche:
        <!-- Zugriff über 'config' Objekt -->
        <input type="checkbox" name="is_active" {% if config.is_active %}checked{% endif %}>
    </label>

    <br><br>
    <button type="submit">Änderungen speichern</button>
    <a href="/show-saved-financial-metrics?branch_profile_id={{ profile.id }}">Abbrechen</a>
</form>
</body>
</html>
