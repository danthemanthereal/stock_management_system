<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Finviz Stock Screener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }

        .filter-row label {
            width: 220px;
            font-weight: bold;
        }

        .filter-row select, .filter-row input {
            width: 100px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .hint {
            font-size: 0.85em;
            color: #666;
            margin-left: 5px;
        }

        .analyse-btn {
            padding: 4px 10px;
            font-size: 0.9em;
            cursor: pointer;
        }

        #metrics-result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            background: #fafafa;
            min-height: 50px;
        }
    </style>
</head>
<body>

<h2>Finviz Stock Screener</h2>
<p>Nur aktivierte und gültige Filter werden gesendet. <br>
    <small>Zahlen bitte <strong>ohne Einheit</strong> eingeben – % wird automatisch ergänzt, wo nötig.</small></p>

<div id="filters-container"></div>

<button onclick="runScreen()">Run</button>

<h3>Results</h3>
<table id="table">
    <thead></thead>
    <tbody></tbody>
</table>

<!-- Bereich für Finanzmetriken -->
<div id="metrics-result"></div>

<script>
    // ✅ 1. Definition der Kennzahlen & Mapping auf das KORREKTE Filterformat
    const filterDefinitions = [
        {name: "P/E", finvizKey: "P/E", format: "ratio"},
        {name: "Forward P/E", finvizKey: "Forward P/E", format: "ratio"},
        {name: "PEG", finvizKey: "PEG", format: "ratio"},
        {name: "P/S", finvizKey: "P/S", format: "ratio"},
        {name: "P/B", finvizKey: "P/B", format: "ratio"},
        {name: "Price/Cash", finvizKey: "Price/Cash", format: "ratio"},
        {name: "Price/Free Cash Flow", finvizKey: "Price/Free Cash Flow", format: "ratio"},
        {name: "Dividend Yield", finvizKey: "Dividend Yield", format: "pct_no_plus"},
        {name: "Return on Assets", finvizKey: "Return on Assets", format: "pct_plus"},
        {name: "Return on Equity", finvizKey: "Return on Equity", format: "pct_plus"},
        {name: "Return on Investment", finvizKey: "Return on Investment", format: "pct_plus"},
        {name: "EPS growth this year", finvizKey: "EPS growththis year", format: "pct_no_plus"},
        {name: "EPS growth next year", finvizKey: "EPS growthnext year", format: "pct_no_plus"},
        {name: "EPS growth past 5 years", finvizKey: "EPS growthpast 5 years", format: "pct_no_plus"},
        {name: "EPS growth next 5 years", finvizKey: "EPS growthnext 5 years", format: "pct_no_plus"},
        {name: "Sales growth past 5 years", finvizKey: "Sales growthpast 5 years", format: "pct_no_plus"},
        {name: "Gross Margin", finvizKey: "Gross Margin", format: "pct_no_plus"},
        {name: "Operating Margin", finvizKey: "Operating Margin", format: "pct_no_plus"},
        {name: "Net Profit Margin", finvizKey: "Net Profit Margin", format: "pct_no_plus"},
        {name: "Debt/Equity", finvizKey: "Debt/Equity", format: "ratio"},
        {name: "LT Debt/Equity", finvizKey: "LT Debt/Equity", format: "ratio"},
        {name: "Current Ratio", finvizKey: "Current Ratio", format: "ratio"},
        {name: "Quick Ratio", finvizKey: "Quick Ratio", format: "ratio"},
        {name: "Market Cap.", finvizKey: "Market Cap.", format: "special"},
        {name: "Float Short", finvizKey: "Float Short", format: "pct_no_plus"},
        {name: "Short Ratio", finvizKey: "Short Ratio", format: "ratio"},
        {name: "Insider Ownership", finvizKey: "InsiderOwnership", format: "pct_no_plus"},
        {name: "Institutional Ownership", finvizKey: "InstitutionalOwnership", format: "pct_no_plus"}
    ];

    // 2. UI aufbauen
    const container = document.getElementById("filters-container");
    filterDefinitions.forEach((def, index) => {
        const row = document.createElement("div");
        row.className = "filter-row";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = `cb-${index}`;

        const label = document.createElement("label");
        label.htmlFor = `cb-${index}`;
        label.textContent = def.name;

        const opSelect = document.createElement("select");
        opSelect.id = `op-${index}`;
        opSelect.innerHTML = '<option value="Over">>=</option><option value="Under"><=</option>';

        const valInput = document.createElement("input");
        valInput.type = "text";
        valInput.inputMode = "decimal";
        valInput.pattern = "[0-9]*[.]?[0-9]*";
        valInput.id = `val-${index}`;
        valInput.placeholder = "z.B. 15";
        valInput.style.width = "80px";

        const unitHint = document.createElement("span");
        unitHint.className = "hint";
        unitHint.textContent = def.format === "ratio" ? "" : "(%)";

        row.appendChild(cb);
        row.appendChild(label);
        row.appendChild(opSelect);
        row.appendChild(valInput);
        row.appendChild(unitHint);
        container.appendChild(row);
    });

    // 3. Filter-String bauen
    function buildFilterString(operator, value, format) {
        const cleanValue = value.replace(/[%\s]/g, '');
        if (cleanValue === "") return "";
        switch (format) {
            case 'pct_plus':
                return operator === "Over" ? `Over +${cleanValue}%` : `Under ${cleanValue}%`;
            case 'pct_no_plus':
                return operator === "Over" ? `Over ${cleanValue}%` : `Under ${cleanValue}%`;
            case 'ratio':
                return operator === "Over" ? `Over ${cleanValue}` : `Under ${cleanValue}`;
            default:
                return `${operator} ${value}`;
        }
    }

    // 4. Hauptfunktion für den API-Aufruf
    async function runScreen() {
        const filters = {};

        filterDefinitions.forEach((def, index) => {
            const checked = document.getElementById(`cb-${index}`).checked;
            if (!checked) return;

            const operator = document.getElementById(`op-${index}`).value;
            let value = document.getElementById(`val-${index}`).value.trim();
            if (value === "") return;

            const filterString = buildFilterString(operator, value, def.format);
            if (filterString === "") return;

            filters[def.finvizKey] = filterString;
        });

        if (Object.keys(filters).length === 0) {
            alert("Bitte mindestens einen Filter aktivieren und ausfüllen.");
            return;
        }

        console.log("Gesendete Filter:", filters);

        try {
            const res = await fetch("/analysis/find-candidates", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(filters)
            });

            const result = await res.json();

            const table = document.getElementById("table");
            table.innerHTML = "";

            if (!result.data || result.data.length === 0) {
                table.innerHTML = "<tr><td>Keine Ergebnisse</td></tr>";
                return;
            }

            // Vorhandene Spalten aus den Daten
            const columns = Object.keys(result.data[0]);

            // Zusätzliche Spalte "Analyse" anhängen
            const allColumns = [...columns, "Analyse"];

            // Kopfzeile
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            allColumns.forEach(col => {
                const th = document.createElement("th");
                th.textContent = col;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Datenzeilen aufbauen
            const tbody = document.createElement("tbody");
            result.data.forEach(row => {
                const tr = document.createElement("tr");

                // Vorhandene Datenzellen
                columns.forEach(col => {
                    const td = document.createElement("td");
                    td.textContent = row[col] ?? "";
                    tr.appendChild(td);
                });

                // Analyse‑Formular
                const tdAnalyse = document.createElement("td");
                const form = document.createElement("form");
                form.action = "/analysis/get-financial-metrics";
                form.method = "post";

                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = "company";
                hiddenInput.value = row.Ticker;   // ← ggf. anpassen (z. B. row.Ticker || row.Symbol)

                const btn = document.createElement("button");
                btn.type = "submit";
                btn.textContent = "Analyse";

                form.appendChild(hiddenInput);
                form.appendChild(btn);
                tdAnalyse.appendChild(form);
                tr.appendChild(tdAnalyse);

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

        } catch (err) {
            console.error(err);
            alert("Fehler beim Abrufen: " + err.message);
        }
    }


</script>

</body>
</html>
