{% extends "base.html" %}
{% block content %}
<style>
    .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: #f9f9f9;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #27ae60;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    .error {
        color: red;
        margin-bottom: 10px;
    }

    .login-link {
        display: block;
        text-align: center;
        margin-top: 15px;
    }
</style>

<div class="form-container">
    <h2>Registrieren</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/auth/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input name="username" placeholder="Benutzername" required>
        <input type="password" name="password" placeholder="Passwort" required>
        <button type="submit">Registrieren</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <a href="/" class="login-link">Bereits registriert? Jetzt anmelden</a>
</div>
{% endblock %}
