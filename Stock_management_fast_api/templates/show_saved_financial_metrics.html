<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Gespiecherte Kennzahlen</h1>

<p>
    <button type="button" id="toggle-active-metrics">Nur aktive Kennzahlen</button>
</p>

<h2>Kennzahl hinzufügen</h2>

<form action="/metrics/create" method="post">
    <input type="text" name="name" placeholder="Name" required>

    <label>
        Steigen in dem Verlauf der Jahre:
        <input type="checkbox" name="should_rise">
    </label>

    <input type="number" name="reference_value" placeholder="Richtwert" required>

    <input type="text" name="unit" placeholder="Einheit" required>

    <button type="submit">Hinzufügen</button>
</form>

<hr>


<form action="/metrics/delete-multiple" method="post">
    <table border="1">
        <tr>
            <th>Auswählen</th>
            <th>Name</th>
            <th>Sollte Steigen</th>
            <th>Richtwert</th>
            <th>Einheit</th>
            <th> Kategorie</th>
            <th>Ist Aktiv</th>
            <th>Actions</th>
        </tr>

        {% for m in metrics %}
        <tr class="saved-metric-row" data-is-active="{{ 'true' if m.is_active else 'false' }}">
            <td>
                <input type="checkbox" name="metric_ids" value="{{ m.id }}">
            </td>
            <td>{{ m.name }}</td>
            <td>{{ m.should_rise }}</td>
            <td>{{ m.reference_value }}</td>
            <td>{{ m.unit }}</td>
            <td> {{m.category }}</td>
            <td>
                <input type="checkbox"
                       name="is_active_{{ m.id }}"
                       {% if m.is_active %}checked{% endif %}>
            </td>
            <td>
                <a href="/metrics/edit/{{ m.id }}">Bearbeiten</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <button type="submit" onclick="return confirm('Ausgewählte Einträge löschen?')">
        Ausgewählte löschen
    </button>
</form>

<script>
(function () {
    var btn = document.getElementById('toggle-active-metrics');
    if (!btn) return;
    var rows = document.querySelectorAll('tr.saved-metric-row');
    var showOnlyActive = false;

    function applyFilter() {
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var active = row.getAttribute('data-is-active') === 'true';
            row.style.display = showOnlyActive && !active ? 'none' : '';
        }
        btn.textContent = showOnlyActive ? 'Alle Kennzahlen anzeigen' : 'Nur aktive Kennzahlen';
    }

    btn.addEventListener('click', function () {
        showOnlyActive = !showOnlyActive;
        applyFilter();
    });
})();
</script>

</body>
</html>
