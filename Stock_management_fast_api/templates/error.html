<!DOCTYPE html>
<html lang="de">
<head>

    <title>Fehler</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 480px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.35rem;
            margin-bottom: 12px;
        }
        p {
            color: #555;
