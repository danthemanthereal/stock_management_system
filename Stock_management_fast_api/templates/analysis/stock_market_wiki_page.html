{% extends "analysis/analysis_base.html" %}

{% block analysis_content %}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div id="markdown-container"></div>

<!-- Markdown aus DB sicher in JSON einbetten -->
<script id="markdown-data" type="text/markdown">
{{ stock_market_wiki_page | e }}
</script>

<script>
    const rawMarkdown = document.getElementById("markdown-data").textContent;

    // Markdown → HTML rendern
    const html = marked.parse(rawMarkdown || "");

    document.getElementById("markdown-container").innerHTML = html;
</script>

<style>
#markdown-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height: 1.6;
}

#markdown-container h1,
#markdown-container h2,
#markdown-container h3 {
    margin-top: 1.2em;
}

#markdown-container pre {
    background: #1e1e1e;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
}

#markdown-container code {
    background: #2a2a2a;
    padding: 2px 5px;
    border-radius: 4px;
}
</style>

{% endblock %}
